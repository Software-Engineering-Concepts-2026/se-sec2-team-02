<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>รีวิวจากผู้ว่าจ้าง</title>

    <link rel="stylesheet" href="phuomin_review.css">
</head>

<body>

    <div class="page">

        <!-- Header -->
        <header class="header">

            <div class="back">
                <span class="back-arrow">←</span>
                <span>กลับ</span>
            </div>

            <div class="logo">
                <div class="logo-main">JOB UP</div>
                <div class="logo-sub">หางานหาคน</div>
            </div>

        </header>


        <!-- Title -->
        <div class="title-row">

            <h1>รีวิวจากผู้ว่าจ้าง</h1>

            <button class="menu-button" aria-label="เมนู">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>


        <!-- Employee information -->
        <section class="person-info">

            <div class="profile-image">
                <!-- ถ้ามีรูปจริง สามารถเปลี่ยนเป็น img ได้ -->
            </div>

            <div class="person-detail">

                <div class="person-name">
                    สมหวัง สั่งได้
                </div>

                <div class="person-text">
                    ประเภทงาน : พนักงานร้านกาแฟ
                </div>

                <div class="person-text">
                    วันที่จบงาน : 10/05/2569
                </div>

            </div>

        </section>


        <!-- Rating -->
        <section class="rating-section">

            <label>ให้คะแนน</label>

            <div class="stars" id="stars">

                <button class="star" data-rating="1">☆</button>
                <button class="star" data-rating="2">☆</button>
                <button class="star" data-rating="3">☆</button>
                <button class="star" data-rating="4">☆</button>
                <button class="star" data-rating="5">☆</button>

            </div>

        </section>


        <!-- Review -->
        <section class="review-section">

            <label for="review">รีวิว</label>

            <textarea
                id="review"
                placeholder="แบ่งปันประสบการณ์...."
            ></textarea>

        </section>


        <!-- Upload -->
        <section class="upload-section">

            <label>อัปโหลดรูปภาพ (ถ้ามี)</label>

            <div class="upload-row">

                <label class="upload-box" for="imageUpload">

                    <span class="plus">+</span>

                    <input
                        type="file"
                        id="imageUpload"
                        accept="image/*"
                    >

                </label>

                <div id="preview"></div>

            </div>

        </section>


        <!-- Submit -->
        <div class="submit-area">

            <button class="submit-button">
                ส่งรีวิว
            </button>

        </div>

    </div>


    <script>

        /* =========================
           Rating
        ========================= */

        const stars = document.querySelectorAll(".star");

        stars.forEach((star, index) => {

            star.addEventListener("click", () => {

                stars.forEach((item, i) => {

                    if (i <= index) {
                        item.textContent = "★";
                        item.classList.add("active");
                    } else {
                        item.textContent = "☆";
                        item.classList.remove("active");
                    }

                });

            });

        });


        /* =========================
           Image Preview
        ========================= */

        const imageUpload = document.getElementById("imageUpload");
        const preview = document.getElementById("preview");

        imageUpload.addEventListener("change", function () {

            const file = this.files[0];

            if (!file) return;

            const reader = new FileReader();

            reader.onload = function (event) {

                preview.innerHTML = `
                    <img
                        src="${event.target.result}"
                        class="preview-image"
                        alt="รูปที่อัปโหลด"
                    >
                `;

            };

            reader.readAsDataURL(file);

        });

    </script>

</body>
</html>
